<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GPX 跑步路線分析</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script>
  <style>
    :root, [data-theme="dark"] {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface2: #243044;
      --border: #2d3a4f;
      --text: #e8eef5;
      --muted: #8b9cb3;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --green: #22c55e;
      --orange: #f59e0b;
      --red: #ef4444;
      --hr-low: #22c55e;
      --hr-mid: #f59e0b;
      --hr-high: #ef4444;
      --chart-grid: rgba(45,58,79,0.8);
      --popup-text: #555;
    }
    [data-theme="light"] {
      --bg: #f4f6f9;
      --surface: #ffffff;
      --surface2: #f0f3f7;
      --border: #d0d7e2;
      --text: #1a2332;
      --muted: #5a6a7e;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --green: #16a34a;
      --orange: #d97706;
      --red: #dc2626;
      --hr-low: #16a34a;
      --hr-mid: #d97706;
      --hr-high: #dc2626;
      --chart-grid: rgba(208,215,226,0.9);
      --popup-text: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
    }
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    header h1 span { color: var(--accent); }
    .upload-zone {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 0.5rem 0.95rem;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-secondary {
      background: var(--surface2);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover { background: var(--border); }
    .btn-sm {
      padding: 0.25rem 0.5rem;
      font-size: 0.75rem;
      border-radius: 6px;
    }
    #fileInput { display: none; }
    main {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0;
      max-width: 1500px;
      margin: 0 auto;
    }
    @media (min-width: 960px) {
      main { grid-template-columns: 1fr 400px; }
    }
    #map {
      height: 50vh;
      min-height: 300px;
      background: var(--surface);
      z-index: 1;
    }
    @media (min-width: 960px) {
      #map { height: calc(100vh - 58px); min-height: 480px; }
    }
    .sidebar {
      background: var(--surface);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      max-height: calc(100vh - 58px);
      padding: 0.85rem;
    }
    .panel {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.85rem;
      margin-bottom: 0.85rem;
    }
    .panel h2 {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--muted);
      margin-bottom: 0.65rem;
      font-weight: 600;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.55rem;
    }
    .stat {
      background: var(--bg);
      border-radius: 8px;
      padding: 0.55rem 0.65rem;
    }
    .stat-label {
      font-size: 0.68rem;
      color: var(--muted);
      margin-bottom: 0.1rem;
    }
    .stat-value {
      font-size: 1.05rem;
      font-weight: 600;
      font-variant-numeric: tabular-nums;
    }
    .stat-value small {
      font-size: 0.7rem;
      font-weight: 400;
      color: var(--muted);
    }
    .empty-state {
      text-align: center;
      padding: 2.5rem 1.2rem;
      color: var(--muted);
    }
    .empty-state p { font-size: 0.9rem; margin-bottom: 0.4rem; }
    .empty-state .hint { font-size: 0.78rem; opacity: 0.75; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.78rem;
    }
    th {
      text-align: left;
      color: var(--muted);
      font-weight: 500;
      padding: 0.35rem 0.3rem;
      border-bottom: 1px solid var(--border);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    td {
      padding: 0.4rem 0.3rem;
      border-bottom: 1px solid rgba(45, 58, 79, 0.5);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    tr:hover td { background: rgba(59, 130, 246, 0.08); }
    tr.active td { background: rgba(59, 130, 246, 0.15); }
    .km-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 0.68rem;
      font-weight: 600;
      padding: 0 4px;
    }
    .hr-bar {
      display: flex;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 0.3rem;
      background: var(--bg);
    }
    .hr-bar span { height: 100%; }
    .hr-legend {
      display: flex;
      gap: 0.65rem;
      margin-top: 0.4rem;
      font-size: 0.68rem;
      color: var(--muted);
      flex-wrap: wrap;
    }
    .hr-legend i {
      display: inline-block;
      width: 9px;
      height: 9px;
      border-radius: 2px;
      margin-right: 0.2rem;
      vertical-align: middle;
    }
    .chart-wrap {
      height: 110px;
      margin-top: 0.4rem;
      position: relative;
    }
    .chart-wrap.overlay {
      height: 160px;
    }
    .chart-legend {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem 0.75rem;
      margin-top: 0.45rem;
      font-size: 0.7rem;
      color: var(--muted);
    }
    .chart-legend span {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .chart-legend i {
      display: inline-block;
      width: 14px;
      height: 3px;
      border-radius: 1px;
    }
    canvas { width: 100% !important; height: 100% !important; }
    .panel-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }
    .panel-head h2 { margin-bottom: 0; }
    .controls {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.55rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
    }
    .toggle input { accent-color: var(--accent); }
    .leaflet-popup-content { font-size: 0.82rem; margin: 0.45rem 0.65rem; color: var(--popup-text); }
    .popup-title { font-weight: 600; margin-bottom: 0.2rem; }
    .popup-row { color: var(--popup-text); font-size: 0.78rem; }
    .error-banner {
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid var(--red);
      color: #fca5a5;
      padding: 0.6rem 0.85rem;
      border-radius: 8px;
      margin-bottom: 0.85rem;
      font-size: 0.8rem;
      display: none;
    }
    .split-pace-fast { color: var(--green); }
    .split-pace-slow { color: var(--orange); }

    /* Run list */
    .run-list { display: flex; flex-direction: column; gap: 0.4rem; }
    .run-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg);
      border-radius: 8px;
      padding: 0.5rem 0.6rem;
      border: 1px solid transparent;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .run-item:hover { border-color: var(--border); }
    .run-item.active { border-color: var(--accent); background: rgba(59,130,246,0.1); }
    .run-item.hidden-run { opacity: 0.45; }
    .run-color {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.3);
    }
    .run-info { flex: 1; min-width: 0; }
    .run-name {
      font-size: 0.8rem;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .run-meta {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.1rem;
    }
    .run-actions { display: flex; gap: 0.25rem; flex-shrink: 0; }
    .icon-btn {
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      padding: 0.2rem;
      border-radius: 4px;
      font-size: 0.85rem;
      line-height: 1;
    }
    .icon-btn:hover { color: var(--text); background: var(--surface2); }

    /* Compare table */
    .compare-wrap { overflow-x: auto; }
    .compare-table th.color-dot::before {
      content: '';
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 4px;
      vertical-align: middle;
      background: var(--dot-color, #888);
    }
    .best { color: var(--green); font-weight: 600; }
    .tabs {
      display: flex;
      gap: 0.25rem;
      margin-bottom: 0.65rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.35rem;
    }
    .tab {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.78rem;
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      cursor: pointer;
    }
    .tab:hover { color: var(--text); background: var(--bg); }
    .tab.active {
      color: var(--text);
      background: var(--accent);
    }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    .lang-switch {
      display: flex;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .lang-switch button {
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.55rem;
      cursor: pointer;
      letter-spacing: 0.02em;
    }
    .lang-switch button.active {
      background: var(--accent);
      color: #fff;
    }
    .lang-switch button:hover:not(.active) {
      color: var(--text);
      background: rgba(59,130,246,0.15);
    }
    .theme-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      width: 34px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }
    .theme-btn:hover { border-color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>🏃 <span>GPX</span> <span data-i18n="appTitle">跑步路線分析</span></h1>
    <div class="upload-zone">
      <div class="lang-switch" id="langSwitch">
        <button type="button" data-lang="zh" class="active">中</button>
        <button type="button" data-lang="en">EN</button>
      </div>
      <button type="button" class="theme-btn" id="themeBtn" title="Theme">🌙</button>
      <label class="btn" for="fileInput" data-i18n="importBtn">＋ 匯入 GPX</label>
      <input type="file" id="fileInput" accept=".gpx,application/gpx+xml,text/xml" multiple />
      <button class="btn btn-secondary" id="clearBtn" disabled data-i18n="clearAll">全部清除</button>
    </div>
  </header>

  <main>
    <div id="map"></div>
    <aside class="sidebar">
      <div class="error-banner" id="errorBanner"></div>

      <div id="emptyState" class="empty-state">
        <p data-i18n="emptyTitle">匯入一個或多個 GPX 開始分析</p>
        <p class="hint" data-i18n-html="emptyHint">可一次選多個檔，疊喺同一地圖比較<br>支援 Apple Watch / WorkoutGPX / HealthFit</p>
      </div>

      <div id="content" style="display:none">
        <!-- Loaded runs -->
        <div class="panel">
          <h2><span data-i18n="loadedRoutes">已載入路線</span> <span id="runCount" style="color:var(--text);font-weight:600"></span></h2>
          <div class="run-list" id="runList"></div>
        </div>

        <div class="tabs">
          <button class="tab active" data-tab="detail" data-i18n="tabDetail">詳情</button>
          <button class="tab" data-tab="compare" data-i18n="tabCompare">比較</button>
        </div>

        <!-- Detail tab (selected run) -->
        <div class="tab-panel active" id="tab-detail">
          <div class="panel">
            <h2><span data-i18n="overview">總覽</span> <span id="detailName" style="text-transform:none;letter-spacing:0;color:var(--text);font-weight:500"></span></h2>
            <div class="stats-grid" id="summaryStats"></div>
          </div>
          <div class="panel">
            <h2 data-i18n="hrDistribution">心率分佈</h2>
            <div class="hr-bar" id="hrBar"></div>
            <div class="hr-legend" id="hrLegend"></div>
            <div class="chart-wrap"><canvas id="hrChart"></canvas></div>
          </div>
          <div class="panel">
            <h2 data-i18n="elevProfile">海拔剖面</h2>
            <div class="chart-wrap overlay"><canvas id="elevChart"></canvas></div>
          </div>
          <div class="panel">
            <h2 data-i18n="kmSplits">每公里分段</h2>
            <div class="controls">
              <label class="toggle"><input type="checkbox" id="showMarkers" checked /> <span data-i18n="kmMarkers">公里標記</span></label>
              <label class="toggle"><input type="checkbox" id="showOtherMarkers" checked /> <span data-i18n="otherMarkers">其他路線標記</span></label>
              <label class="toggle"><input type="checkbox" id="showTracks" checked /> <span data-i18n="tracks">路線</span></label>
            </div>
            <div style="overflow-x:auto">
              <table>
                <thead>
                  <tr>
                    <th data-i18n="thKm">公里</th>
                    <th data-i18n="thArrival">到達</th>
                    <th data-i18n="thPace">配速</th>
                    <th data-i18n="thAvgHr">平均心率</th>
                    <th data-i18n="thElev">爬升</th>
                  </tr>
                </thead>
                <tbody id="splitsBody"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- Compare tab -->
        <div class="tab-panel" id="tab-compare">
          <div class="panel">
            <div class="panel-head">
              <h2 data-i18n="compareOverview">總覽比較</h2>
              <button type="button" class="btn btn-secondary btn-sm" id="exportCsvBtn" data-i18n="exportCsv">匯出 CSV</button>
            </div>
            <div class="compare-wrap">
              <table class="compare-table" id="compareSummary">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="panel">
            <h2 data-i18n="overlayPace">配速 vs 距離</h2>
            <div class="chart-wrap overlay"><canvas id="paceOverlayChart"></canvas></div>
            <div class="chart-legend" id="paceOverlayLegend"></div>
          </div>
          <div class="panel">
            <h2 data-i18n="overlayHr">心率 vs 距離</h2>
            <div class="chart-wrap overlay"><canvas id="hrOverlayChart"></canvas></div>
            <div class="chart-legend" id="hrOverlayLegend"></div>
          </div>
          <div class="panel">
            <h2 data-i18n="overlayElev">海拔 vs 距離</h2>
            <div class="chart-wrap overlay"><canvas id="elevOverlayChart"></canvas></div>
            <div class="chart-legend" id="elevOverlayLegend"></div>
          </div>
          <div class="panel">
            <h2 data-i18n="comparePace">每公里配速比較</h2>
            <div class="compare-wrap">
              <table class="compare-table" id="compareSplits">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
          <div class="panel">
            <h2 data-i18n="compareHr">每公里心率比較</h2>
            <div class="compare-wrap">
              <table class="compare-table" id="compareHR">
                <thead></thead>
                <tbody></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </aside>
  </main>

        exportCsv: 'Export CSV',
        overlayPace: 'Pace vs distance',
        overlayHr: 'HR vs distance',
        themeToggle: 'Toggle theme',
        noOverlayData: 'Not enough data to chart',
        elevProfile: 'Elevation profile',
        overlayElev: 'Elevation vs distance',
        noElevData: 'No elevation data',
        weatherTemp: 'Avg temp',
        weatherHumidity: 'Avg humidity',
        weatherWind: 'Avg wind',
        weatherLoading: 'Loading weather…',
        weatherNA: '—',
        weatherSamples: '({n} hours)',
      }
    };

    let lang = localStorage.getItem('gpx-lang') || 'zh';
    if (!I18N[lang]) lang = 'zh';

    function t(key, vars) {
      let s = (I18N[lang] && I18N[lang][key]) || (I18N.zh[key]) || key;
      if (vars) {
        Object.keys(vars).forEach(k => {
          s = s.replace(new RegExp('\\{' + k + '\\}', 'g'), vars[k]);
        });
      }
      return s;
    }

    function applyStaticI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        el.textContent = t(key);
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const key = el.getAttribute('data-i18n-html');
        el.innerHTML = t(key);
      });
      document.title = t('pageTitle');
      document.querySelectorAll('#langSwitch button').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.lang === lang);
      });
    }

    function setLang(next) {
      if (!I18N[next] || next === lang) return;
      lang = next;
      localStorage.setItem('gpx-lang', lang);
      applyStaticI18n();
      // Re-render dynamic content
      if (runs.length) {
        renderRunList();
        const run = runs.find(r => r.id === selectedId);
        if (run) {
          renderSummary(run.summary);
          renderHR(run.points);
          drawElevChart(run.points);
          renderSplits(run.splits);
          rebuildMapLayers();
        }
        renderCompare();
      }
    }

    // ========== Theme ==========
    let theme = localStorage.getItem('gpx-theme') || 'dark';
    if (theme !== 'light' && theme !== 'dark') theme = 'dark';

    function applyTheme() {
      document.documentElement.setAttribute('data-theme', theme);
      const btn = $('#themeBtn');
      if (btn) {
        btn.textContent = theme === 'dark' ? '🌙' : '☀️';
        btn.title = t('themeToggle');
      }
      // Redraw charts with new colors
      if (typeof runs !== 'undefined' && runs.length) {
        const run = runs.find(r => r.id === selectedId);
        if (run) {
          renderHR(run.points);
          drawElevChart(run.points);
        }
        if ($('#tab-compare')?.classList.contains('active')) {
          renderOverlayCharts();
        }
      }
    }

    function toggleTheme() {
      theme = theme === 'dark' ? 'light' : 'dark';
      localStorage.setItem('gpx-theme', theme);
      applyTheme();
    }

    // ========== Colors ==========
    const RUN_COLORS = [
      '#3b82f6', '#ef4444', '#22c55e', '#f59e0b', '#a855f7',
      '#06b6d4', '#ec4899', '#84cc16', '#f97316', '#6366f1'
    ];

    // ========== Utilities ==========
    const $ = (sel) => document.querySelector(sel);
    const $$ = (sel) => document.querySelectorAll(sel);
    const fmt = {
      time(sec) {
        if (sec == null || isNaN(sec)) return '—';
        sec = Math.round(sec);
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        return `${m}:${String(s).padStart(2,'0')}`;
      },
      pace(secPerKm) {
        if (secPerKm == null || !isFinite(secPerKm) || secPerKm <= 0) return '—';
        let total = Math.round(secPerKm);
        let m = Math.floor(total / 60);
        let s = total % 60;
        if (s >= 60) { m += 1; s -= 60; }
        return `${m}:${String(s).padStart(2,'0')}/km`;
      },
      dist(m) {
        if (m >= 1000) return (m / 1000).toFixed(2) + ' km';
        return Math.round(m) + ' m';
      },
      elev(m) {
        if (m == null) return '—';
        return (m >= 0 ? '+' : '') + Math.round(m) + ' m';
      },
      hr(v) {
        if (v == null || isNaN(v)) return '—';
        return Math.round(v) + ' bpm';
      },
      date(d) {
        if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '—';
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
      },
      clock(d) {
        if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '—';
        const h = String(d.getHours()).padStart(2, '0');
        const m = String(d.getMinutes()).padStart(2, '0');
        return `${h}:${m}`;
      },
      datetime(d) {
        if (!d || !(d instanceof Date) || isNaN(d.getTime())) return '—';
        return `${fmt.date(d)} ${fmt.clock(d)}`;
      }
    };

    function haversine(lat1, lon1, lat2, lon2) {
      const R = 6371000;
      const toRad = (d) => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLon = toRad(lon2 - lon1);
      const a = Math.sin(dLat/2)**2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLon/2)**2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    function shortName(filename) {
      return filename.replace(/\.gpx$/i, '').replace(/[_-]+/g, ' ').slice(0, 40);
    }

    // ========== GPX Parser ==========
    function parseGPX(xmlText) {
      const parser = new DOMParser();
      const doc = parser.parseFromString(xmlText, 'application/xml');
      if (doc.querySelector('parsererror')) {
        throw new Error(t('errBadGpx'));
      }

      let pts = [...doc.querySelectorAll('trkpt')];
      if (pts.length === 0) pts = [...doc.querySelectorAll('rtept')];
      if (pts.length === 0) throw new Error(t('errNoTrack'));

      const points = [];
      for (const el of pts) {
        const lat = parseFloat(el.getAttribute('lat'));
        const lon = parseFloat(el.getAttribute('lon'));
        if (isNaN(lat) || isNaN(lon)) continue;

        const timeEl = el.querySelector('time');
        const elevEl = el.querySelector('ele');
        let hr = null;
        const hrEl =
          el.querySelector('hr') ||
          el.querySelector('*[local-name="hr"]') ||
          el.getElementsByTagNameNS('*', 'hr')[0];
        if (hrEl && hrEl.textContent) {
          const v = parseFloat(hrEl.textContent.trim());
          if (!isNaN(v) && v > 20 && v < 250) hr = v;
        }

        points.push({
          lat, lon,
          ele: elevEl ? parseFloat(elevEl.textContent) : null,
          time: timeEl ? new Date(timeEl.textContent.trim()) : null,
          hr
        });
      }

      if (points.length < 2) throw new Error(t('errFewPoints'));

      let dist = 0;
      points[0].dist = 0;
      points[0].dt = 0;
      for (let i = 1; i < points.length; i++) {
        dist += haversine(points[i-1].lat, points[i-1].lon, points[i].lat, points[i].lon);
        points[i].dist = dist;
        if (points[i].time && points[0].time) {
          points[i].dt = (points[i].time - points[0].time) / 1000;
        } else {
          points[i].dt = null;
        }
      }
      return points;
    }

    function computeSplits(points, intervalM = 1000) {
      const totalDist = points[points.length - 1].dist;
      const splits = [];
      let nextKm = intervalM;
      let startIdx = 0;
      let startDist = 0;
      let startCumDt = 0;
      let elevStart = points[0].ele;

      for (let i = 1; i < points.length; i++) {
        while (points[i].dist >= nextKm && nextKm <= totalDist + 0.5) {
          const prev = points[i - 1];
          const curr = points[i];
          const segDist = curr.dist - prev.dist;
          const ratio = segDist > 0 ? (nextKm - prev.dist) / segDist : 0;
          const lat = prev.lat + (curr.lat - prev.lat) * ratio;
          const lon = prev.lon + (curr.lon - prev.lon) * ratio;
          const ele = (prev.ele != null && curr.ele != null)
            ? prev.ele + (curr.ele - prev.ele) * ratio
            : (curr.ele ?? prev.ele);

          let cumDt = null;
          let t = null;
          if (prev.dt != null && curr.dt != null) {
            cumDt = prev.dt + (curr.dt - prev.dt) * ratio;
          }
          if (prev.time && curr.time) {
            t = new Date(prev.time.getTime() + (curr.time - prev.time) * ratio);
            if (cumDt == null && points[0].time) {
              cumDt = (t - points[0].time) / 1000;
            }
          }

          const splitDuration = (cumDt != null) ? (cumDt - startCumDt) : null;
          const hrs = [];
          for (let j = startIdx; j <= i; j++) {
            if (points[j].hr != null) hrs.push(points[j].hr);
          }
          const avgHr = hrs.length ? hrs.reduce((a, b) => a + b, 0) / hrs.length : null;
          const elevGain = (ele != null && elevStart != null) ? (ele - elevStart) : null;
          const splitDist = nextKm - startDist;
          const pace = (splitDuration != null && splitDist > 0)
            ? (splitDuration / splitDist) * 1000 : null;

          splits.push({
            km: nextKm / 1000,
            lat, lon, ele,
            time: t,
            duration: splitDuration,
            cumDuration: cumDt,
            pace,
            avgHr,
            elevDelta: elevGain,
            startIdx, endIdx: i
          });

          startIdx = i;
          startDist = nextKm;
          if (cumDt != null) startCumDt = cumDt;
          elevStart = ele;
          nextKm += intervalM;
        }
      }

      const remain = totalDist - startDist;
      if (remain > 50) {
        const last = points[points.length - 1];
        const hrs = [];
        for (let j = startIdx; j < points.length; j++) {
          if (points[j].hr != null) hrs.push(points[j].hr);
        }
        const avgHr = hrs.length ? hrs.reduce((a, b) => a + b, 0) / hrs.length : null;
        let cumDt = last.dt;
        if (cumDt == null && last.time && points[0].time) {
          cumDt = (last.time - points[0].time) / 1000;
        }
        const splitDuration = (cumDt != null) ? (cumDt - startCumDt) : null;
        const elevGain = (last.ele != null && elevStart != null) ? (last.ele - elevStart) : null;
        const pace = (splitDuration != null && remain > 0)
          ? (splitDuration / remain) * 1000 : null;
        splits.push({
          km: totalDist / 1000,
          lat: last.lat, lon: last.lon, ele: last.ele,
          time: last.time,
          duration: splitDuration,
          cumDuration: cumDt,
          pace, avgHr,
          elevDelta: elevGain,
          startIdx, endIdx: points.length - 1,
          partial: true
        });
      }
      return splits;
    }

    function summarize(points) {
      const last = points[points.length - 1];
      const dist = last.dist;
      let duration = null;
      if (last.dt != null) duration = last.dt;
      else if (points[0].time && last.time) duration = (last.time - points[0].time) / 1000;

      const startTime = points[0].time || null;
      const endTime = last.time || null;

      const hrs = points.filter(p => p.hr != null).map(p => p.hr);
      const avgHr = hrs.length ? hrs.reduce((a, b) => a + b, 0) / hrs.length : null;
      const maxHr = hrs.length ? Math.max(...hrs) : null;
      const minHr = hrs.length ? Math.min(...hrs) : null;

      let elevGain = 0, elevLoss = 0;
      for (let i = 1; i < points.length; i++) {
        if (points[i].ele != null && points[i-1].ele != null) {
          const d = points[i].ele - points[i-1].ele;
          if (d > 0) elevGain += d;
          else elevLoss += -d;
        }
      }
      const pace = (duration != null && dist > 0) ? (duration / dist) * 1000 : null;

      // Centroid for weather lookup
      let latSum = 0, lonSum = 0;
      points.forEach(p => { latSum += p.lat; lonSum += p.lon; });
      const lat = latSum / points.length;
      const lon = lonSum / points.length;

      return {
        dist, duration, startTime, endTime, lat, lon,
        avgHr, maxHr, minHr, elevGain, elevLoss, pace,
        pointCount: points.length, hasHr: hrs.length > 0
      };
    }

    // ========== Weather (Open-Meteo) ==========
    function toDateStr(d) {
      // local YYYY-MM-DD
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }

    async function fetchWeatherForRun(run) {
      const sum = run.summary;
      if (!sum.startTime || !sum.endTime || sum.lat == null || sum.lon == null) {
        run.weather = { status: 'error' };
        return;
      }
      run.weather = { status: 'loading' };
      refreshWeatherUI(run);

      const start = sum.startTime;
      const end = sum.endTime;
      // Expand slightly so boundary hours are included
      const startDate = toDateStr(start);
      let endDate = toDateStr(end);
      // If run crosses midnight, endDate is already next day
      const startMs = start.getTime();
      const endMs = end.getTime();

      const params = new URLSearchParams({
        latitude: sum.lat.toFixed(4),
        longitude: sum.lon.toFixed(4),
        start_date: startDate,
        end_date: endDate,
        hourly: 'temperature_2m,relative_humidity_2m,wind_speed_10m',
        timezone: 'auto',
        wind_speed_unit: 'ms'
      });

      try {
        // Prefer archive (ERA5). Recent days may lag ~5 days — fallback to forecast past_days.
        let url = `https://archive-api.open-meteo.com/v1/archive?${params}`;
        let res = await fetch(url);
        let data = res.ok ? await res.json() : null;

        const hasHourly = data && data.hourly && data.hourly.time && data.hourly.time.length;
        if (!hasHourly) {
          // Fallback: forecast API with past_days (good for last ~2 weeks)
          const daysAgo = Math.ceil((Date.now() - startMs) / 86400000) + 1;
          const pastDays = Math.min(92, Math.max(1, daysAgo));
          const fParams = new URLSearchParams({
            latitude: sum.lat.toFixed(4),
            longitude: sum.lon.toFixed(4),
            hourly: 'temperature_2m,relative_humidity_2m,wind_speed_10m',
            past_days: String(pastDays),
            forecast_days: '1',
            timezone: 'auto',
            wind_speed_unit: 'ms'
          });
          res = await fetch(`https://api.open-meteo.com/v1/forecast?${fParams}`);
          data = res.ok ? await res.json() : null;
        }

        if (!data || !data.hourly || !data.hourly.time) {
          run.weather = { status: 'error' };
          refreshWeatherUI(run);
          return;
        }

        const times = data.hourly.time;
        const temps = data.hourly.temperature_2m || [];
        const hums = data.hourly.relative_humidity_2m || [];
        const winds = data.hourly.wind_speed_10m || [];

        const tempsSel = [], humsSel = [], windsSel = [];
        for (let i = 0; i < times.length; i++) {
          // Open-Meteo times are local wall time when timezone=auto, parse as local
          const t = new Date(times[i]);
          const tMs = t.getTime();
          // Include hour if it overlaps [start, end] (hour block starting at t)
          const hourEnd = tMs + 3600000;
          if (hourEnd > startMs && tMs < endMs) {
            if (temps[i] != null && !isNaN(temps[i])) tempsSel.push(temps[i]);
            if (hums[i] != null && !isNaN(hums[i])) humsSel.push(hums[i]);
            if (winds[i] != null && !isNaN(winds[i])) windsSel.push(winds[i]);
          }
        }

        // If no overlap (timezone edge cases), take closest hours within ±3h of midpoint
        if (!tempsSel.length && temps.length) {
          const mid = (startMs + endMs) / 2;
          let best = 0, bestDiff = Infinity;
          for (let i = 0; i < times.length; i++) {
            const diff = Math.abs(new Date(times[i]).getTime() - mid);
            if (diff < bestDiff) { bestDiff = diff; best = i; }
          }
          const lo = Math.max(0, best - 1);
          const hi = Math.min(times.length - 1, best + 1);
          for (let i = lo; i <= hi; i++) {
            if (temps[i] != null) tempsSel.push(temps[i]);
            if (hums[i] != null) humsSel.push(hums[i]);
            if (winds[i] != null) windsSel.push(winds[i]);
          }
        }

        const avg = (arr) => arr.length ? arr.reduce((a, b) => a + b, 0) / arr.length : null;
        run.weather = {
          status: 'ok',
          temp: avg(tempsSel),
          humidity: avg(humsSel),
          wind: avg(windsSel), // m/s
          samples: Math.max(tempsSel.length, humsSel.length, windsSel.length),
          lat: data.latitude,
          lon: data.longitude
        };
      } catch (e) {
        console.error('weather fetch failed', e);
        run.weather = { status: 'error' };
      }
      refreshWeatherUI(run);
    }

    function refreshWeatherUI(run) {
      if (run.id === selectedId) {
        renderSummary(run.summary);
      }
      if ($('#tab-compare')?.classList.contains('active')) {
        renderCompare();
      }
    }

    function weatherLabel(run, key) {
      const w = run.weather;
      if (!w || w.status === 'loading') return t('weatherLoading');
      if (w.status !== 'ok') return t('weatherNA');
      if (key === 'temp') return w.temp != null ? `${w.temp.toFixed(1)} °C` : t('weatherNA');
      if (key === 'humidity') return w.humidity != null ? `${Math.round(w.humidity)} %` : t('weatherNA');
      if (key === 'wind') return w.wind != null ? `${w.wind.toFixed(1)} m/s` : t('weatherNA');
      return t('weatherNA');
    }

    // ========== State ==========
    let runs = []; // { id, name, color, points, splits, summary, visible, layer, markersLayer }
    let selectedId = null;
    let nextColorIdx = 0;
    let map, allBounds = null;

    // ========== Map ==========
    function initMap() {
      map = L.map('map', { zoomControl: true }).setView([22.3, 114.17], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap',
        maxZoom: 19
      }).addTo(map);
    }

    function rebuildMapLayers() {
      // Remove old layers
      runs.forEach(r => {
        if (r.layer) map.removeLayer(r.layer);
        if (r.markersLayer) map.removeLayer(r.markersLayer);
      });

      allBounds = null;
      const showTracks = $('#showTracks')?.checked !== false;
      const showMarkers = $('#showMarkers')?.checked !== false;
      const showOtherMarkers = $('#showOtherMarkers')?.checked !== false;

      runs.forEach(run => {
        if (!run.visible) return;

        const latlngs = run.points.map(p => [p.lat, p.lon]);
        const isSelected = run.id === selectedId;
        const poly = L.polyline(latlngs, {
          color: run.color,
          weight: isSelected ? 5 : 3,
          opacity: isSelected ? 0.95 : 0.65,
          lineJoin: 'round'
        });

        // Direction arrows along the route
        const decorator = L.polylineDecorator(poly, {
          patterns: [{
            offset: 40,
            repeat: isSelected ? 80 : 120,
            symbol: L.Symbol.arrowHead({
              pixelSize: isSelected ? 10 : 8,
              polygon: false,
              pathOptions: {
                stroke: true,
                color: run.color,
                weight: isSelected ? 2.5 : 2,
                opacity: isSelected ? 0.95 : 0.7
              }
            })
          }]
        });

        run.layer = L.layerGroup([poly, decorator]);
        if (showTracks) run.layer.addTo(map);

        // Start / end — selected solid, others semi-transparent
        const seOpacity = isSelected ? 1 : 0.4;
        const start = L.circleMarker([run.points[0].lat, run.points[0].lon], {
          radius: isSelected ? 7 : 5,
          color: run.color,
          fillColor: '#22c55e',
          fillOpacity: seOpacity,
          opacity: seOpacity,
          weight: 2
        }).bindPopup(`<div class="popup-title">${run.name}</div><div class="popup-row">${t('startPoint')}</div>`);
        const end = L.circleMarker([run.points[run.points.length-1].lat, run.points[run.points.length-1].lon], {
          radius: isSelected ? 7 : 5,
          color: run.color,
          fillColor: '#ef4444',
          fillOpacity: seOpacity,
          opacity: seOpacity,
          weight: 2
        }).bindPopup(`<div class="popup-title">${run.name}</div><div class="popup-row">${t('endPoint')}</div>`);

        const markers = [start, end];

        // KM markers for all runs; selected solid, others semi-transparent
        // Non-selected markers can be hidden via showOtherMarkers toggle
        if (isSelected || showOtherMarkers) {
          const opacity = isSelected ? 1 : 0.35;
          const size = isSelected ? 26 : 20;
          const fontSize = isSelected ? 11 : 9;
          const border = isSelected ? '2px solid #fff' : '1px solid rgba(255,255,255,0.5)';
          const shadow = isSelected
            ? '0 1px 5px rgba(0,0,0,.5)'
            : '0 1px 2px rgba(0,0,0,.25)';
          const zIndex = isSelected ? 600 : 400;

          run.splits.forEach((s) => {
            if (s.partial) return;
            const label = Math.round(s.km);
            const icon = L.divIcon({
              className: '',
              html: `<div style="
                background:${run.color};color:#fff;
                width:${size}px;height:${size}px;border-radius:50%;
                display:flex;align-items:center;justify-content:center;
                font-size:${fontSize}px;font-weight:700;
                border:${border};box-shadow:${shadow};
                opacity:${opacity};">${label}</div>`,
              iconSize: [size, size],
              iconAnchor: [size / 2, size / 2]
            });
            const m = L.marker([s.lat, s.lon], { icon, zIndexOffset: zIndex });
            m.bindPopup(`
              <div class="popup-title">${run.name} · ${t('kmN', { n: label })}</div>
              <div class="popup-row">${t('arrival')}：${fmt.time(s.cumDuration)}</div>
              <div class="popup-row">${t('splitTime')}：${fmt.time(s.duration)}（${fmt.pace(s.pace)}）</div>
              <div class="popup-row">${t('avgHr')}：${fmt.hr(s.avgHr)}</div>
              <div class="popup-row">${t('elevChange')}：${fmt.elev(s.elevDelta)}</div>
            `);
            markers.push(m);
          });
        }

        run.markersLayer = L.layerGroup(markers);
        if (showMarkers) run.markersLayer.addTo(map);

        const b = poly.getBounds();
        allBounds = allBounds ? allBounds.extend(b) : b;
      });

      if (allBounds && allBounds.isValid()) {
        map.fitBounds(allBounds, { padding: [30, 30] });
      }
    }

    // ========== UI ==========
    function showError(msg) {
      const el = $('#errorBanner');
      el.textContent = msg;
      el.style.display = 'block';
      setTimeout(() => { el.style.display = 'none'; }, 5000);
    }

    function renderRunList() {
      const list = $('#runList');
      $('#runCount').textContent = `(${runs.length})`;
      list.innerHTML = runs.map(r => `
        <div class="run-item ${r.id === selectedId ? 'active' : ''} ${r.visible ? '' : 'hidden-run'}" data-id="${r.id}">
          <div class="run-color" style="background:${r.color}"></div>
          <div class="run-info">
            <div class="run-name">${r.name}</div>
            <div class="run-meta">${fmt.date(r.summary.startTime)} · ${fmt.dist(r.summary.dist)} · ${fmt.time(r.summary.duration)}</div>
          </div>
          <div class="run-actions">
            <button class="icon-btn" data-action="toggle" title="${t('showHide')}">${r.visible ? '👁' : '👁‍🗨'}</button>
            <button class="icon-btn" data-action="remove" title="${t('remove')}">✕</button>
          </div>
        </div>
      `).join('');

      list.querySelectorAll('.run-item').forEach(el => {
        el.addEventListener('click', (e) => {
          const action = e.target.closest('[data-action]')?.dataset.action;
          const id = el.dataset.id;
          if (action === 'toggle') {
            const run = runs.find(r => r.id === id);
            if (run) {
              run.visible = !run.visible;

              renderRunList();
              if ($('#tab-compare')?.classList.contains('active')) renderCompare();

            e.stopPropagation();
          } else if (action === 'remove') {
            removeRun(id);
            e.stopPropagation();
          } else {
            selectRun(id);
          }
        });
      });
    }

    function renderHR(points) {
      const hrs = points.filter(p => p.hr != null).map(p => p.hr);
      const bar = $('#hrBar');
      const legend = $('#hrLegend');
      if (!hrs.length) {
        bar.innerHTML = '';
        legend.innerHTML = `<span>${t('noHrData')}</span>`;
        drawHRChart([]);
        return;
      }
      let low = 0, mid = 0, high = 0;
      hrs.forEach(h => {
        if (h < 140) low++;
        else if (h < 165) mid++;
        else high++;
      });
      const total = hrs.length;
      bar.innerHTML = `
        <span style="width:${(low/total)*100}%;background:var(--hr-low)"></span>
        <span style="width:${(mid/total)*100}%;background:var(--hr-mid)"></span>
        <span style="width:${(high/total)*100}%;background:var(--hr-high)"></span>
      `;
      legend.innerHTML = `
        <span><i style="background:var(--hr-low)"></i>&lt;140 (${Math.round(low/total*100)}%)</span>
        <span><i style="background:var(--hr-mid)"></i>140–165 (${Math.round(mid/total*100)}%)</span>
        <span><i style="background:var(--hr-high)"></i>&gt;165 (${Math.round(high/total*100)}%)</span>
      `;
      drawHRChart(points);
    }

    function drawHRChart(points) {
      const canvas = $('#hrChart');
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
      const W = rect.width, H = rect.height;
      ctx.clearRect(0, 0, W, H);

      const withHr = points.filter(p => p.hr != null && p.dist != null);
      if (withHr.length < 2) {
        ctx.fillStyle = '#8b9cb3';
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t('noHrChart'), W / 2, H / 2);
        return;
      }

      const minHr = Math.min(...withHr.map(p => p.hr)) - 5;
      const maxHr = Math.max(...withHr.map(p => p.hr)) + 5;
      const maxDist = withHr[withHr.length - 1].dist;
      const pad = { t: 8, b: 18, l: 32, r: 8 };
      const plotW = W - pad.l - pad.r;
      const plotH = H - pad.t - pad.b;

      const styles = getComputedStyle(document.documentElement);
      const gridColor = styles.getPropertyValue('--chart-grid').trim() || 'rgba(45,58,79,0.8)';
      const mutedColor = styles.getPropertyValue('--muted').trim() || '#8b9cb3';
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.fillStyle = mutedColor;
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      for (let i = 0; i <= 3; i++) {
        const y = pad.t + plotH * (1 - i / 3);
        const val = minHr + (maxHr - minHr) * (i / 3);
        ctx.beginPath();
        ctx.moveTo(pad.l, y);
        ctx.lineTo(W - pad.r, y);
        ctx.stroke();
        ctx.fillText(Math.round(val), pad.l - 4, y + 3);
      }

      ctx.beginPath();
      ctx.strokeStyle = styles.getPropertyValue('--red').trim() || '#ef4444';
      ctx.lineWidth = 1.5;
      withHr.forEach((p, i) => {
        const x = pad.l + (p.dist / maxDist) * plotW;
        const y = pad.t + plotH * (1 - (p.hr - minHr) / (maxHr - minHr));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      drawDistanceAxis(ctx, pad, plotW, plotH, H, maxDist, mutedColor, gridColor);
    }

    /** X-axis: tick every 500m, label every 1km */
    function drawDistanceAxis(ctx, pad, plotW, plotH, H, maxDist, mutedColor, gridColor) {
      if (!maxDist || maxDist <= 0) return;
      ctx.textAlign = 'center';
      ctx.font = '10px sans-serif';
      ctx.setLineDash([]);

      const axisY = pad.t + plotH;
      // Draw every 500m using integer meters to avoid float issues
      const maxM = Math.floor(maxDist);
      for (let d = 0; d <= maxM; d += 500) {
        const x = pad.l + (d / maxDist) * plotW;
        const isKm = d % 1000 === 0;

        if (isKm) {
          // Full km: longer tick + dashed vertical guide
          ctx.strokeStyle = mutedColor;
          ctx.lineWidth = 1.25;
          ctx.beginPath();
          ctx.moveTo(x, axisY);
          ctx.lineTo(x, axisY + 6);
          ctx.stroke();

          if (d > 0 && d < maxDist - 80) {
            ctx.strokeStyle = gridColor;
            ctx.lineWidth = 0.7;
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(x, pad.t);
            ctx.lineTo(x, axisY);
            ctx.stroke();
            ctx.setLineDash([]);
          }

          ctx.fillStyle = mutedColor;
          ctx.fillText(String(d / 1000), x, H - 2);
        } else {
          // 500m: short tick upward into chart + downward
          ctx.strokeStyle = mutedColor;
          ctx.globalAlpha = 0.55;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(x, axisY - 6);
          ctx.lineTo(x, axisY + 4);
          ctx.stroke();
          ctx.globalAlpha = 1;
        }
      }

      // End label if not on exact km
      const endKm = maxDist / 1000;
      if (Math.abs(endKm - Math.round(endKm)) > 0.05) {
        ctx.fillStyle = mutedColor;
        ctx.fillText(endKm.toFixed(1), pad.l + plotW, H - 2);
      }
    }

    /** Sample series along distance for overlay charts */
    function sampleSeries(run, mode, stepM = 50) {
      const pts = run.points;
      if (!pts.length) return [];
      const total = pts[pts.length - 1].dist;
      const out = [];
      for (let d = 0; d <= total; d += stepM) {
        // find segment
        let i = 1;
        while (i < pts.length && pts[i].dist < d) i++;
        if (i >= pts.length) i = pts.length - 1;
        const prev = pts[i - 1] || pts[0];
        const curr = pts[i];
        const seg = curr.dist - prev.dist;
        const ratio = seg > 0 ? (d - prev.dist) / seg : 0;
        let val = null;
        if (mode === 'hr') {
          if (prev.hr != null && curr.hr != null) val = prev.hr + (curr.hr - prev.hr) * ratio;
          else val = curr.hr ?? prev.hr;
        } else if (mode === 'elev') {
          if (prev.ele != null && curr.ele != null) val = prev.ele + (curr.ele - prev.ele) * ratio;
          else val = curr.ele ?? prev.ele;
        } else if (mode === 'pace') {
          // instantaneous pace from nearby points (±30s or ±100m window)
          const win = 80; // meters
          let j0 = i, j1 = i;
          while (j0 > 0 && pts[i].dist - pts[j0].dist < win) j0--;
          while (j1 < pts.length - 1 && pts[j1].dist - pts[i].dist < win) j1++;
          const dd = pts[j1].dist - pts[j0].dist;
          const dt0 = pts[j0].dt, dt1 = pts[j1].dt;
          if (dd > 10 && dt0 != null && dt1 != null && dt1 > dt0) {
            val = ((dt1 - dt0) / dd) * 1000; // sec/km
          }
        }
        if (val != null && isFinite(val)) out.push({ dist: d, val });
      }
      return out;
    }

    function drawOverlayChart(canvasId, legendId, mode) {
      const canvas = $('#' + canvasId);
      const legend = $('#' + legendId);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      if (rect.width < 10) return;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const W = rect.width, H = rect.height;
      ctx.clearRect(0, 0, W, H);

      const visible = runs.filter(r => r.visible);
      const series = visible.map(r => ({
        run: r,
        data: sampleSeries(r, mode)
      })).filter(s => s.data.length >= 2);

      const styles = getComputedStyle(document.documentElement);
      const gridColor = styles.getPropertyValue('--chart-grid').trim() || 'rgba(45,58,79,0.8)';
      const mutedColor = styles.getPropertyValue('--muted').trim() || '#8b9cb3';

      if (!series.length) {
        ctx.fillStyle = mutedColor;
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t('noOverlayData'), W / 2, H / 2);
        if (legend) legend.innerHTML = '';
        return;
      }

      let minV = Infinity, maxV = -Infinity, maxDist = 0;
      series.forEach(s => {
        s.data.forEach(p => {
          if (p.val < minV) minV = p.val;
          if (p.val > maxV) maxV = p.val;
        });
        const last = s.data[s.data.length - 1].dist;
        if (last > maxDist) maxDist = last;
      });
      if (mode === 'pace') {
        // pad pace range
        minV = Math.max(120, minV - 15); // not faster than ~2:00/km for scale
        maxV = maxV + 15;
      } else if (mode === 'elev') {
        const padE = Math.max(5, (maxV - minV) * 0.1 || 5);
        minV -= padE;
        maxV += padE;
      } else {
        // HR etc.
        minV = Math.max(40, minV - 5);
        maxV = maxV + 5;
      }
      if (maxV <= minV) { maxV = minV + 1; }

      const pad = { t: 10, b: 20, l: 40, r: 10 };
      const plotW = W - pad.l - pad.r;
      const plotH = H - pad.t - pad.b;

      // grid + y labels
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.fillStyle = mutedColor;
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      for (let i = 0; i <= 4; i++) {
        const y = pad.t + plotH * (i / 4);
        // For pace: higher pace (slower) at bottom visually? Use higher value at bottom (normal)
        const val = maxV - (maxV - minV) * (i / 4);
        ctx.beginPath();
        ctx.moveTo(pad.l, y);
        ctx.lineTo(W - pad.r, y);
        ctx.stroke();
        const label = mode === 'pace'
          ? fmt.pace(val).replace('/km', '')
          : mode === 'elev'
            ? Math.round(val) + 'm'
            : String(Math.round(val));
        ctx.fillText(label, pad.l - 4, y + 3);
      }

      drawDistanceAxis(ctx, pad, plotW, plotH, H, maxDist, mutedColor, gridColor);

      // lines
      series.forEach(s => {
        ctx.beginPath();
        ctx.strokeStyle = s.run.color;
        ctx.lineWidth = s.run.id === selectedId ? 2.5 : 1.5;
        ctx.globalAlpha = s.run.id === selectedId ? 1 : 0.75;
        s.data.forEach((p, i) => {
          const x = pad.l + (p.dist / maxDist) * plotW;
          // y: higher value near top for HR; same for pace (slower = higher sec/km = higher on chart)
          const y = pad.t + plotH * (1 - (p.val - minV) / (maxV - minV));
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
        });
        ctx.stroke();
        ctx.globalAlpha = 1;
      });

      if (legend) {
        legend.innerHTML = series.map(s =>
          `<span><i style="background:${s.run.color}"></i>${s.run.name.slice(0, 18)}</span>`
        ).join('');
      }
    }

    function renderOverlayCharts() {
      drawOverlayChart('paceOverlayChart', 'paceOverlayLegend', 'pace');
      drawOverlayChart('hrOverlayChart', 'hrOverlayLegend', 'hr');
      drawOverlayChart('elevOverlayChart', 'elevOverlayLegend', 'elev');
    }

    function drawElevChart(points) {
      const canvas = $('#elevChart');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.parentElement.getBoundingClientRect();
      if (rect.width < 10) return;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const W = rect.width, H = rect.height;
      ctx.clearRect(0, 0, W, H);

      const styles = getComputedStyle(document.documentElement);
      const gridColor = styles.getPropertyValue('--chart-grid').trim() || 'rgba(45,58,79,0.8)';
      const mutedColor = styles.getPropertyValue('--muted').trim() || '#8b9cb3';
      const accent = styles.getPropertyValue('--accent').trim() || '#3b82f6';
      const green = styles.getPropertyValue('--green').trim() || '#22c55e';

      const withEle = points.filter(p => p.ele != null && p.dist != null);
      if (withEle.length < 2) {
        ctx.fillStyle = mutedColor;
        ctx.font = '12px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(t('noElevData'), W / 2, H / 2);
        return;
      }

      let minE = Math.min(...withEle.map(p => p.ele));
      let maxE = Math.max(...withEle.map(p => p.ele));
      const padE = Math.max(5, (maxE - minE) * 0.1);
      minE -= padE;
      maxE += padE;
      if (maxE <= minE) maxE = minE + 10;
      const maxDist = withEle[withEle.length - 1].dist;

      const pad = { t: 10, b: 20, l: 40, r: 10 };
      const plotW = W - pad.l - pad.r;
      const plotH = H - pad.t - pad.b;

      // grid
      ctx.strokeStyle = gridColor;
      ctx.lineWidth = 1;
      ctx.fillStyle = mutedColor;
      ctx.font = '10px sans-serif';
      ctx.textAlign = 'right';
      for (let i = 0; i <= 4; i++) {
        const y = pad.t + plotH * (i / 4);
        const val = maxE - (maxE - minE) * (i / 4);
        ctx.beginPath();
        ctx.moveTo(pad.l, y);
        ctx.lineTo(W - pad.r, y);
        ctx.stroke();
        ctx.fillText(Math.round(val) + 'm', pad.l - 4, y + 3);
      }

      // filled area under profile
      ctx.beginPath();
      withEle.forEach((p, i) => {
        const x = pad.l + (p.dist / maxDist) * plotW;
        const y = pad.t + plotH * (1 - (p.ele - minE) / (maxE - minE));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      const lastX = pad.l + plotW;
      const baseY = pad.t + plotH;
      ctx.lineTo(lastX, baseY);
      ctx.lineTo(pad.l, baseY);
      ctx.closePath();
      ctx.fillStyle = accent + '33';
      // fallback if accent is not hex
      try {
        ctx.fillStyle = accent.length <= 7 ? accent + '33' : 'rgba(59,130,246,0.2)';
      } catch (_) {
        ctx.fillStyle = 'rgba(59,130,246,0.2)';
      }
      ctx.fill();

      // line
      ctx.beginPath();
      ctx.strokeStyle = accent;
      ctx.lineWidth = 2;
      withEle.forEach((p, i) => {
        const x = pad.l + (p.dist / maxDist) * plotW;
        const y = pad.t + plotH * (1 - (p.ele - minE) / (maxE - minE));
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();

      // min / max markers
      const minPt = withEle.reduce((a, b) => a.ele <= b.ele ? a : b);
      const maxPt = withEle.reduce((a, b) => a.ele >= b.ele ? a : b);
      [[minPt, green], [maxPt, styles.getPropertyValue('--red').trim() || '#ef4444']].forEach(([pt, color]) => {
        const x = pad.l + (pt.dist / maxDist) * plotW;
        const y = pad.t + plotH * (1 - (pt.ele - minE) / (maxE - minE));
        ctx.beginPath();
        ctx.fillStyle = color;
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      });

      drawDistanceAxis(ctx, pad, plotW, plotH, H, maxDist, mutedColor, gridColor);
    }

    function exportCompareCsv() {
      const visible = runs.filter(r => r.visible);
      if (!visible.length) return;

      const rows = [];
      // Overview section
      rows.push([t('compareOverview')]);
      rows.push([t('loadedRoutes'), ...visible.map(r => r.name)]);
      rows.push([t('date'), ...visible.map(r => fmt.date(r.summary.startTime))]);
      rows.push([t('start'), ...visible.map(r => fmt.clock(r.summary.startTime))]);
      rows.push([t('dist'), ...visible.map(r => (r.summary.dist / 1000).toFixed(3))]);
      rows.push([t('elapsed'), ...visible.map(r => fmt.time(r.summary.duration))]);
      rows.push([t('avgPace'), ...visible.map(r => fmt.pace(r.summary.pace))]);
      rows.push([t('avgHr'), ...visible.map(r => r.summary.avgHr != null ? Math.round(r.summary.avgHr) : '')]);
      rows.push([t('maxHr'), ...visible.map(r => r.summary.maxHr != null ? Math.round(r.summary.maxHr) : '')]);
      rows.push([t('elevGain'), ...visible.map(r => Math.round(r.summary.elevGain))]);
      rows.push([t('weatherTemp'), ...visible.map(r => r.weather && r.weather.status === 'ok' && r.weather.temp != null ? r.weather.temp.toFixed(1) : '')]);
      rows.push([t('weatherHumidity'), ...visible.map(r => r.weather && r.weather.status === 'ok' && r.weather.humidity != null ? Math.round(r.weather.humidity) : '')]);
      rows.push([t('weatherWind'), ...visible.map(r => r.weather && r.weather.status === 'ok' && r.weather.wind != null ? r.weather.wind.toFixed(1) : '')]);
      rows.push([]);

      // Pace by km
      rows.push([t('comparePace')]);
      rows.push([t('thKm'), ...visible.map(r => r.name)]);
      const maxKm = Math.max(...visible.map(r => r.splits.filter(s => !s.partial).length), 0);
      for (let k = 1; k <= maxKm; k++) {
        rows.push([
          k,
          ...visible.map(r => {
            const s = r.splits.find(sp => !sp.partial && Math.round(sp.km) === k);
            return s && s.pace != null ? fmt.pace(s.pace) : '';
          })
        ]);
      }
      rows.push([]);

      // HR by km
      rows.push([t('compareHr')]);
      rows.push([t('thKm'), ...visible.map(r => r.name)]);
      for (let k = 1; k <= maxKm; k++) {
        rows.push([
          k,
          ...visible.map(r => {
            const s = r.splits.find(sp => !sp.partial && Math.round(sp.km) === k);
            return s && s.avgHr != null ? Math.round(s.avgHr) : '';
          })
        ]);
      }

      const csv = rows.map(row =>
        row.map(cell => {
          const s = String(cell ?? '');
          return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
        }).join(',')
      ).join('\n');

      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `gpx-compare-${new Date().toISOString().slice(0, 10)}.csv`;
      a.click();
      URL.revokeObjectURL(a.href);
    }

    function renderSplits(splits) {
      const tbody = $('#splitsBody');
      const paces = splits.filter(s => s.pace != null).map(s => s.pace);
      const avgPace = paces.length ? paces.reduce((a, b) => a + b, 0) / paces.length : null;

      tbody.innerHTML = splits.map((s, idx) => {
        const label = s.partial ? s.km.toFixed(2) : Math.round(s.km);
        const paceClass = (avgPace && s.pace != null)
          ? (s.pace < avgPace * 0.97 ? 'split-pace-fast' : (s.pace > avgPace * 1.03 ? 'split-pace-slow' : ''))
          : '';
        return `<tr data-idx="${idx}">
          <td><span class="km-badge">${label}</span></td>
          <td>${fmt.time(s.cumDuration)}</td>
          <td class="${paceClass}">${fmt.pace(s.pace)}</td>
          <td>${fmt.hr(s.avgHr)}</td>
          <td>${fmt.elev(s.elevDelta)}</td>
        </tr>`;
      }).join('');

      tbody.querySelectorAll('tr').forEach(tr => {
        tr.addEventListener('click', () => {
          tbody.querySelectorAll('tr').forEach(r => r.classList.remove('active'));
          tr.classList.add('active');
          const idx = parseInt(tr.dataset.idx, 10);
          const run = runs.find(r => r.id === selectedId);
          if (run && run.splits[idx]) {
            const s = run.splits[idx];
            map.setView([s.lat, s.lon], Math.max(map.getZoom(), 16), { animate: true });
          }
        });
      });
    }

    function renderCompare() {
      const visible = runs.filter(r => r.visible);
      if (visible.length === 0) return;

      // Summary comparison
      const sumTable = $('#compareSummary');
      const metrics = [
        { key: 'startTime', label: t('date'), fmt: (r) => fmt.date(r.summary.startTime), best: null },
        { key: 'startClock', label: t('start'), fmt: (r) => fmt.clock(r.summary.startTime), best: null },
        { key: 'dist', label: t('dist'), fmt: (r) => fmt.dist(r.summary.dist), best: 'max' },
        { key: 'duration', label: t('elapsed'), fmt: (r) => fmt.time(r.summary.duration), best: 'min' },
        { key: 'pace', label: t('avgPace'), fmt: (r) => fmt.pace(r.summary.pace), best: 'min' },
        { key: 'avgHr', label: t('avgHr'), fmt: (r) => fmt.hr(r.summary.avgHr), best: null },
        { key: 'maxHr', label: t('maxHr'), fmt: (r) => fmt.hr(r.summary.maxHr), best: null },
        { key: 'elevGain', label: t('elevGain'), fmt: (r) => Math.round(r.summary.elevGain) + ' m', best: null },
        { key: 'wTemp', label: t('weatherTemp'), fmt: (r) => weatherLabel(r, 'temp'), best: null },
        { key: 'wHum', label: t('weatherHumidity'), fmt: (r) => weatherLabel(r, 'humidity'), best: null },
        { key: 'wWind', label: t('weatherWind'), fmt: (r) => weatherLabel(r, 'wind'), best: null },
      ];

      sumTable.querySelector('thead').innerHTML = `<tr>
        <th></th>
        ${visible.map(r => `<th class="color-dot" style="--dot-color:${r.color}">${r.name.slice(0,12)}</th>`).join('')}
      </tr>`;
      sumTable.querySelector('tbody').innerHTML = metrics.map(m => {
        let bestVal = null;
        if (m.best === 'min') {
          bestVal = Math.min(...visible.map(r => r.summary[m.key]).filter(v => v != null));
        } else if (m.best === 'max') {
          bestVal = Math.max(...visible.map(r => r.summary[m.key]).filter(v => v != null));
        }
        return `<tr>
          <td>${m.label}</td>
          ${visible.map(r => {
            const v = r.summary[m.key];
            const isBest = m.best && v != null && v === bestVal;
            return `<td class="${isBest ? 'best' : ''}">${m.fmt(r)}</td>`;
          }).join('')}
        </tr>`;
      }).join('');

      // Pace splits comparison
      const maxKm = Math.max(...visible.map(r =>
        r.splits.filter(s => !s.partial).length
      ));
      const paceTable = $('#compareSplits');
      paceTable.querySelector('thead').innerHTML = `<tr>
        <th>${t('thKm')}</th>
        ${visible.map(r => `<th class="color-dot" style="--dot-color:${r.color}">${r.name.slice(0,10)}</th>`).join('')}
      </tr>`;
      let paceRows = '';
      for (let k = 1; k <= maxKm; k++) {
        const vals = visible.map(r => {
          const s = r.splits.find(sp => !sp.partial && Math.round(sp.km) === k);
          return s ? s.pace : null;
        });
        const best = Math.min(...vals.filter(v => v != null));
        paceRows += `<tr>
          <td><span class="km-badge">${k}</span></td>
          ${vals.map(v => `<td class="${v != null && v === best ? 'best' : ''}">${fmt.pace(v)}</td>`).join('')}
        </tr>`;
      }
      paceTable.querySelector('tbody').innerHTML = paceRows;

      // HR splits comparison
      const hrTable = $('#compareHR');
      hrTable.querySelector('thead').innerHTML = `<tr>
        <th>${t('thKm')}</th>
        ${visible.map(r => `<th class="color-dot" style="--dot-color:${r.color}">${r.name.slice(0,10)}</th>`).join('')}
      </tr>`;
      let hrRows = '';
      for (let k = 1; k <= maxKm; k++) {
        const vals = visible.map(r => {
          const s = r.splits.find(sp => !sp.partial && Math.round(sp.km) === k);
          return s ? s.avgHr : null;
        });
        hrRows += `<tr>
          <td><span class="km-badge">${k}</span></td>
          ${vals.map(v => `<td>${fmt.hr(v)}</td>`).join('')}
        </tr>`;
      }
      hrTable.querySelector('tbody').innerHTML = hrRows;
      renderOverlayCharts();
    }

    function selectRun(id) {
      selectedId = id;
      const run = runs.find(r => r.id === id);
      if (!run) return;
      $('#detailName').textContent = '· ' + run.name;
      renderSummary(run.summary);
      renderHR(run.points);
      drawElevChart(run.points);
      renderSplits(run.splits);
      renderRunList();
      rebuildMapLayers();
      if ($('#tab-compare')?.classList.contains('active')) renderCompare();
    }

    function removeRun(id) {
      const run = runs.find(r => r.id === id);
      if (run) {
        if (run.layer) map.removeLayer(run.layer);
        if (run.markersLayer) map.removeLayer(run.markersLayer);
      }
      runs = runs.filter(r => r.id !== id);
      if (selectedId === id) {
        selectedId = runs.length ? runs[runs.length - 1].id : null;
      }
      if (runs.length === 0) {
        $('#content').style.display = 'none';
        $('#emptyState').style.display = 'block';
        $('#clearBtn').disabled = true;
      } else {
        selectRun(selectedId);
        renderCompare();
      }
      renderRunList();
      rebuildMapLayers();
    }

    function addRun(name, points) {
      const splits = computeSplits(points, 1000);
      const summary = summarize(points);
      const id = 'run_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const color = RUN_COLORS[nextColorIdx % RUN_COLORS.length];
      nextColorIdx++;
      const run = {
        id, name: shortName(name), color,
        points, splits, summary,
        visible: true,
        weather: null,
        layer: null, markersLayer: null
      };
      runs.push(run);
      selectedId = id;

      $('#emptyState').style.display = 'none';
      $('#content').style.display = 'block';
      $('#clearBtn').disabled = false;

      renderRunList();
      selectRun(id);
      renderCompare();
      fetchWeatherForRun(run);
    }

    function clearAll() {
      runs.forEach(r => {
        if (r.layer) map.removeLayer(r.layer);
        if (r.markersLayer) map.removeLayer(r.markersLayer);
      });
      runs = [];
      selectedId = null;
      nextColorIdx = 0;
      $('#content').style.display = 'none';
      $('#emptyState').style.display = 'block';
      $('#clearBtn').disabled = true;
      $('#fileInput').value = '';
    }

    function loadFiles(fileList) {
      const files = [...fileList].filter(f =>
        f.name.toLowerCase().endsWith('.gpx') || f.type.includes('xml')
      );
      if (!files.length) {
        showError(t('errSelectGpx'));
        return;
      }
      let loaded = 0;
      files.forEach(file => {
        const reader = new FileReader();
        reader.onload = () => {
          try {
            const points = parseGPX(reader.result);
            addRun(file.name, points);
            loaded++;
          } catch (err) {
            showError(`${file.name}: ${err.message}`);
          }
        };
        reader.onerror = () => showError(t('errReadFail', { name: file.name }));
        reader.readAsText(file);
      });
    }

    // ========== Events ==========
    $('#fileInput').addEventListener('change', (e) => {
      if (e.target.files.length) loadFiles(e.target.files);
      e.target.value = '';
    });
    $('#clearBtn').addEventListener('click', clearAll);

    document.body.addEventListener('dragover', (e) => e.preventDefault());
    document.body.addEventListener('drop', (e) => {
      e.preventDefault();
      if (e.dataTransfer.files.length) loadFiles(e.dataTransfer.files);
    });

    // Tabs
    $$('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        $$('.tab').forEach(t => t.classList.remove('active'));
        $$('.tab-panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        $(`#tab-${tab.dataset.tab}`).classList.add('active');
        if (tab.dataset.tab === 'compare') renderCompare();
      });
    });

    // Map toggles
    document.addEventListener('change', (e) => {
      if (e.target.id === 'showMarkers' || e.target.id === 'showOtherMarkers' || e.target.id === 'showTracks') {
        rebuildMapLayers();
      }
    });

    // Language switch
    $('#langSwitch').addEventListener('click', (e) => {
      const btn = e.target.closest('button[data-lang]');
      if (btn) setLang(btn.dataset.lang);
    });

    // Theme toggle
    $('#themeBtn').addEventListener('click', toggleTheme);

    // CSV export
    $('#exportCsvBtn').addEventListener('click', exportCompareCsv);

    // Init
    applyTheme();
    applyStaticI18n();
    initMap();
    window.addEventListener('resize', () => {
      if (map) map.invalidateSize();
      const run = runs.find(r => r.id === selectedId);
      if (run) {
        drawHRChart(run.points);
        drawElevChart(run.points);
      }
      if ($('#tab-compare')?.classList.contains('active')) renderOverlayCharts();
    });
  </script>
</body>
</html>
